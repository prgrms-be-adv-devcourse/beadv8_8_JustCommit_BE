# 운영 서버(EC2)용. 같은 폴더의 .env(커밋 금지)에서 값을 읽는다.
# 실행: docker compose -f docker-compose.prod.yml up -d --build
# 외부에서는 Nginx(80/443)만 접근하고, 아래 포트는 모두 127.0.0.1(서버 자신)에만 열린다.
name: replant

services:
  app:
    build: .
    image: replant-app:latest
    container_name: replant-app
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod,perf # perf: 성능 측정(#351) 지표 설정
    ports:
      - "127.0.0.1:8080:8080" # Nginx만 접근
      - "127.0.0.1:8081:8081" # 성능 측정(#351) 지표. SSH 터널로만 접근
    mem_limit: 1g
    networks:
      default: {}
      # 모의 택배사(404-express, 별도 compose)와 같은 서버에서 통신하는 공유 네트워크
      # 404-express는 웹훅을 http://replant-app:8080/api/v1/webhooks/courier 로 보낸다
      replant-net:
        aliases: [replant-app]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: replant-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432" # SSH 터널로만 접속
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: replant-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.2.1
    container_name: replant-kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 같은 compose 안의 app만 kafka:9092로 접속한다 (서버 밖, 서버 호스트에도 열지 않음)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      # 9092 포트가 열렸는지만 본다. kafka-topics.sh는 매번 JVM을 새로 띄워
      # CPU 크레딧이 떨어진 EC2에서 10초를 넘겨 unhealthy가 되고 app 기동을 막았다 (#184)
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 성능 측정(#351): 서버 CPU · 메모리 · 디스크 지표. CPU steal 값으로 크레딧 제한도 보인다
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: replant-node-exporter
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100" # SSH 터널로만 접근
    restart: unless-stopped

  # 성능 측정(#351): DB 연결 수 · 잠금 수 · 트랜잭션 지표
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: replant-postgres-exporter
    environment:
      DATA_SOURCE_URI: postgres:5432/${DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: ${DB_USERNAME}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:9187:9187" # SSH 터널로만 접근
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 성능 측정(#351): 가짜 외부 서버. 택배는 404-express로 중계하면서 지연만 더하고, 토스 승인은 항상 성공으로 답한다
  # 지연은 perf/fakes/set-delay.sh로 재시작 없이 바꾼다
  perf-fakes:
    image: wiremock/wiremock:3.13.1
    container_name: replant-perf-fakes
    command:
      - --port=8080
      - --no-request-journal # 요청 기록을 쌓지 않는다 (부하 중 메모리 증가 방지)
      - --disable-request-logging
      - --async-response-enabled=true # 지연 중에도 스레드를 붙잡지 않는다
      - --async-response-threads=50
      - --container-threads=200
    environment:
      JAVA_OPTS: -Xmx256m
    volumes:
      - ./perf/fakes/mappings:/home/wiremock/mappings:ro
    ports:
      - "127.0.0.1:8089:8080" # 지연 변경용 관리 API. SSH 터널로만 접근
    mem_limit: 384m
    networks:
      default: {}
      replant-net: {} # 404-express로 중계
    restart: unless-stopped

networks:
  # 서버에서 처음 한 번 만든다: docker network create replant-net
  replant-net:
    external: true

volumes:
  postgres-data:
  redis-data:
  kafka-data:
