spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USERNAME:notification_app}
    password: ${DB_PASSWORD:notification_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.justcommit.backend.common.messaging.consumer.EventEnvelopeDeserializer
    listener:
      # TODO(Kafka 연결 Task): market.events.v1 구독 · EventEnvelope 매핑을 붙이면 true로 바꾼다
      # 지금은 구독 코드만 옮겨 두고 시작하지 않는다 (market이 보내는 타입 헤더의 패키지가 notification 이벤트 record와 달라 받아도 읽지 못함)
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:false}

server:
  port: 8086
jwt:
  public-key: ${JWT_PUBLIC_KEY}

custom:
  kafka:
    topics:
      market-events: ${MARKET_EVENTS_TOPIC:market.events.v1}
      shipment-status-changed: ${SHIPMENT_STATUS_CHANGED_TOPIC:market.shipment-status-changed.v1}
