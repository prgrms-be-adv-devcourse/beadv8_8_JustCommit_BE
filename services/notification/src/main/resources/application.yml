spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USERNAME:notification_app}
    password: ${DB_PASSWORD:notification_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    consumer:
      # Consumer Group = 서비스 이름 (docs/conventions/events.md)
      group-id: notification
      # 그룹이 처음 붙을 때는 지금부터 받음: 켜기 전에 쌓인 지난 이벤트로 늦은 알림이 한꺼번에 생기지 않게 (#561)
      # 한 번 붙은 뒤에는 커밋한 위치부터 이어 받으므로 재배포 중에 온 이벤트는 빠지지 않음
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 봉투(EventEnvelope)로 받음. 형식이 깨지면 재시도 없이 원래토픽.DLT
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.justcommit.backend.common.messaging.consumer.EventEnvelopeDeserializer
    listener:
      # TODO(#561 ④): 운영 배포 준비가 끝나면 기본값을 true로 바꾼다
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:false}

server:
  port: 8086
jwt:
  public-key: ${JWT_PUBLIC_KEY}

