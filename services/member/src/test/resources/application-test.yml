# 테스트 전용 값 (운영·실제 데이터에 사용 금지)
# JWT 개인키·공개키는 파일에 두지 않고 테스트 실행마다 새로 만든다 (MemberApplicationTests)
spring:
  # 테스트 클래스마다 스프링 컨텍스트가 캐시에 남아 연결 풀을 계속 쥔다. 공유 PostgreSQL(max_connections=300)을
  # 넘지 않도록, 쉬는 컨텍스트는 연결을 놓게 한다 (최대 10개는 그대로라 동시성 테스트에는 영향 없음)
  datasource:
    hikari:
      minimum-idle: 0
      # Hikari는 밀리초 숫자로 받는다 (10s 같은 Duration 표기 불가)
      idle-timeout: 10000
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret

account:
  encryption-key: fpbj/8EvmkgpWJBkWKQz4wXmSqMNixbOXY7pZb92ZR4=

custom:
  oauth2:
    state-secret: test-only-oauth2-state-secret-0123456789

# 내부 API 키 (테스트 전용). 내부 호출 그룹이 있으면 키 없이 앱이 시작하지 않음
internal-api:
  key: test-internal-key

messaging:
  address-event-cipher:
    keys:
      k1: j67s7+Xp5+E8lvE1U0Z3PPDekVxUOlBFhBp6pSuoMWg=

# 폐기 재처리 스케줄러는 테스트에서 끈다 (테스트가 만든 PENDING 작업을 중간에 처리하지 않게). 재처리는 서비스를 직접 불러 확인
member:
  hmac-key: Ykrj3QEmlzI3Qklcvkhl/OdmVli7c2FS0nXnisaRXsw=
  token-revocation:
    retry:
      enabled: false
  # 탈퇴 기록 정리도 테스트에서 끈다. 정리는 테스트에서 스케줄러를 직접 만들어 확인
  withdrawal-record:
    cleanup:
      enabled: false
  # 카카오 어드민 키는 기본값이 없어 테스트용 가짜 값을 둔다 (실제 호출은 WireMock 테스트에서만)
  kakao:
    admin-key: test-kakao-admin-key
    app-id: "1234567"
  # 카카오 연결 해제 웹훅 처리 스케줄러도 끈다. 테스트는 처리 서비스를 직접 부름
  kakao-unlink:
    processing:
      enabled: false
