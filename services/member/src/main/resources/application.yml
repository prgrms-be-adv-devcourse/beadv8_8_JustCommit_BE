spring:
  application:
    name: member-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/member_db}
    username: ${DB_USERNAME:member_app}
    password: ${DB_PASSWORD:member_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  # 내부 API 그룹 주소 (탈퇴 확인 #406). 그룹 이름은 internal-api.groups와 같음. 연결 1초 · 응답 3초는 common-web 기본값
  http:
    serviceclient:
      market:
        base-url: ${MARKET_SERVICE_URL:http://localhost:8083}
      payment:
        base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
      settlement:
        base-url: ${SETTLEMENT_SERVICE_URL:http://localhost:8085}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Redis가 멈춰도 요청 스레드가 오래 묶이지 않도록 짧게 (Lettuce 기본 60초)
      timeout: 2s
      connect-timeout: 2s
  mail:
    host: smtp.gmail.com
    port: 587
    # 비어 있어도 시작은 됨 (메일 발송 때만 실패)
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 8081
  # Gateway 뒤에서 X-Forwarded-* 헤더로 원래 주소를 계산 (카카오 redirect_uri가 내부 주소로 만들어지지 않도록)
  forward-headers-strategy: framework

# 비밀값은 기본값 없음: 환경변수가 없으면 시작 실패
jwt:
  public-key: ${JWT_PUBLIC_KEY}
  private-key: ${JWT_PRIVATE_KEY}
  access-token-expiration: 30m
  signup-token-expiration: 10m

# 환급 계좌번호 AES-256-GCM 암호화 키 (32바이트, Base64)
account:
  encryption-key: ${ACCOUNT_ENCRYPTION_KEY}

custom:
  cookie:
    # 쿠키 Secure 속성. 운영 HTTPS면 COOKIE_SECURE=true
    secure: ${COOKIE_SECURE:false}
  oauth2:
    # 카카오 로그인 state 쿠키 서명 키 (openssl rand -base64 32)
    state-secret: ${OAUTH2_STATE_SECRET}
  frontend:
    # 소셜 로그인 후 돌아갈 프론트 주소
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

# 판매자 주소 이벤트 전송 키 (member · market에 같은 값). 기본값 없음: 비어 있으면 앱이 시작하지 않음
messaging:
  address-event-cipher:
    current-key: k1
    keys:
      k1: ${MEMBER_ADDRESS_EVENT_KEY}

# 서비스 간 내부 API(/internal/**) 키와 내부 호출 그룹. 모든 서비스가 같은 키
# 빈 기본값: 키가 없으면 받는 쪽은 /internal/** 요청을 모두 거부하고(common-security), 내부 호출 그룹이 있으면 common-web이 앱 시작을 막는다
internal-api:
  key: ${INTERNAL_API_KEY:}
  groups: [market, payment, settlement]

# 회원 행 잠금 대기 제한 (#409). 넘으면 409 MEMBER_BUSY. 잠금 한 번마다의 제한 (MemberLocker)
member:
  # 회원 정보 HMAC-SHA256 키 (#413 계좌 중복 확인). 32바이트 Base64, AES 키와 별도
  # 기본값 없음: 비어 있으면 앱이 시작하지 않음 (운영은 배포 전에 MEMBER_HMAC_KEY 주입 필요)
  hmac-key: ${MEMBER_HMAC_KEY}
  lock:
    timeout: 3s
  token-revocation:
    # 폐기 키 보관 여유 (#409). 보관 기한 = 폐기 시각 + Access 수명 + 여유. 운영 측정값이 나오기 전 초기값
    retention-margin: 60s
    # 폐기 기록 재처리 (#409). 끄려면 enabled: false
    retry:
      enabled: true
      interval: PT10S
  # 30일 지난 탈퇴 기록 정리 (#407). 끄려면 enabled: false
  withdrawal-record:
    cleanup:
      enabled: true
      interval: PT1H
  # 메일 발송 전용 실행기 (#421). 인증 메일 · 가입 계정 안내 메일을 요청 밖에서 보낸다
  mail:
    executor:
      # 스레드 수 (core = max). 측정 전 초기값
      threads: 2
      # 대기열 크기. 넘치면 제출 거절. 기다리는 동안에도 인증번호 TTL(5분)이 줄어드므로 대기 시간과 함께 조정. 측정 전 초기값
      queue-capacity: 20
