spring:
  application:
    name: ai-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_db}
    username: ${DB_USERNAME:ai_app}
    password: ${DB_PASSWORD:ai_app}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    consumer:
      group-id: ai
      # 그룹이 처음 생길 때(첫 배포), 그 전에 쌓인 이벤트부터 읽어 스냅샷을 채움
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.justcommit.backend.common.messaging.consumer.EventEnvelopeDeserializer
  ai:
    # 임베딩만 쓴다. 같은 OpenAI starter의 채팅 · 이미지 · 음성 · 검열 모델은 만들지 않음
    model:
      chat: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        # 차원을 바꾸면 벡터 테이블의 vector(1536) 칸과 저장된 벡터를 모두 다시 만들어야 함
        model: text-embedding-3-small
        dimensions: 1536

server:
  port: 8087
jwt:
  public-key: ${JWT_PUBLIC_KEY}
internal-api:
  # 빈 기본값: 환경변수가 없으면 /internal/** 요청을 모두 거부한다 (common-security)
  key: ${INTERNAL_API_KEY:}
