spring:
  application:
    name: ai-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_db}
    username: ${DB_USERNAME:ai_app}
    password: ${DB_PASSWORD:ai_app}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    consumer:
      group-id: ai
      # 그룹이 처음 생길 때(첫 배포), 그 전에 쌓인 이벤트부터 읽어 스냅샷을 채움
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.justcommit.backend.common.messaging.consumer.EventEnvelopeDeserializer
  ai:
    # 임베딩만 쓴다. 같은 OpenAI starter의 채팅 · 이미지 · 음성 · 검열 모델은 만들지 않음
    model:
      chat: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      # 모델 · 차원은 아래 custom.embedding 한 곳에서 정하고 Spring AI도 같은 값을 읽게 한다
      embedding:
        model: ${custom.embedding.model}
        dimensions: ${custom.embedding.dimensions}

server:
  port: 8087
jwt:
  public-key: ${JWT_PUBLIC_KEY}
custom:
  # 챗봇 (#297, ADR 0031). 값 조정 기록은 docs/services/ai.md 「정책」
  # 질문 임베딩은 품종 의미 검색의 QueryEmbedder(species-search.timeout, 재시도 없음),
  # 품종 문서 최소 유사도는 species-search.min-similarity를 같이 쓴다
  chatbot:
    product-top-k: 6
    species-top-k: 3
    # 질문과 상품 문서의 코사인 유사도가 이 값보다 낮으면 상품 카드에서 뺀다 (🟨 출발값, 대표 질문으로 조정)
    # 11/20 실제 키 확인: 관계없는 질문(날씨) 최고 0.261, 관계있는 질문 상위 0.30~0.39
    product-min-similarity: 0.28
    # 위 하한을 넘는 상품이 0개일 때, 하한 없이 가장 가까운 판매 중 상품을 대안으로 프롬프트에 넣는 수
    alternative-top-k: 3
    # 프롬프트에 넣는 최근 메시지 수 (질문 · 답변 5쌍)
    history-size: 10
    # 상품 검색과 동시에 하는 품종 검색을 기다리는 최대 시간 (#636, 넘으면 품종 검색 실패와 같은 응답)
    species-search-timeout: 2s
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      timeout: 10s
  # 임베딩 모델 · 차원. 모델을 바꿀 때 여기(또는 환경변수)만 고친다 (#508)
  # 차원을 바꾸면 벡터 테이블의 vector(1536) 칸과 저장된 벡터를 모두 다시 만들어야 함
  embedding:
    model: ${EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${EMBEDDING_DIMENSIONS:1536}
  # 품종 의미 검색 (docs/flows/search-recommend.md 「품종 의미 검색」)
  species-search:
    # OpenAI 질의 임베딩 한 번의 제한 시간, 재시도 없음 (docs/conventions/resilience.md)
    timeout: 3s
    # 이보다 유사도가 낮은 품종은 결과에서 뺌 (🟨 로컬 실측값, docs/flows/search-recommend.md)
    min-similarity: ${SPECIES_SEARCH_MIN_SIMILARITY:0.35}
  # 질문 임베딩 캐시 (#636): 품종 의미 검색 · 챗봇이 같은 질문이면 OpenAI를 다시 부르지 않음. 파드 메모리(Caffeine)
  # 벡터 1개 ≈ 6KB → 1,000개 ≈ 7MB (ai 파드 메모리 640Mi)
  query-embedding-cache:
    max-size: 1000
    ttl: 24h
internal-api:
  # 빈 기본값: 환경변수가 없으면 /internal/** 요청을 모두 거부한다 (common-security)
  key: ${INTERNAL_API_KEY:}
