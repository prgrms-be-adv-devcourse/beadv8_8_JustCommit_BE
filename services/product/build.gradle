plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'software.amazon.awssdk:bom:2.55.10'
    }
}

dependencies {
    implementation project(':common:common-core')
    implementation project(':common:common-web')
    implementation project(':common:common-security-servlet')
    implementation project(':common:common-messaging')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // market · member 이벤트 구독
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    // API 문서
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    // 이미지 업로드 (S3 Presigned URL)
    implementation 'software.amazon.awssdk:s3'

    // Outbox 발행 (common-messaging을 api로 함께 가져옴)
    implementation project(':common:common-messaging-outbox')

    // 사진 검수: Claude Haiku 식물 식별 (OpenAI Moderation은 RestClient로 직접 호출)
    implementation 'com.anthropic:anthropic-java:3.3.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
