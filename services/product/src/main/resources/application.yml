spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${DB_USERNAME:product_app}
    password: ${DB_PASSWORD:product_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    consumer:
      # Consumer Group = 서비스 이름 (docs/conventions/events.md)
      group-id: product
      # 그룹이 처음 붙을 때 앞에 쌓인 이벤트부터 받음 (판매 완료 · 해제를 놓치지 않게)
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 봉투로 못 바꾸는 메시지는 재시도 없이 원래토픽.DLT, 처리 실패는 1 · 2 · 4초 재시도 뒤 DLT (common-messaging 공통 설정)
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.justcommit.backend.common.messaging.consumer.EventEnvelopeDeserializer
    listener:
      concurrency: 3

server:
  port: 8082

jwt:
  public-key: ${JWT_PUBLIC_KEY}

# /internal/** 요청의 X-Internal-Key 확인용 (common-security). 비어 있으면 앱은 뜨고 내부 요청만 401
internal-api:
  key: ${INTERNAL_API_KEY:}

custom:
  # 상품 검색 (원본은 DB, OpenSearch는 다시 만들 수 있는 복사본). 타임아웃은 docs/conventions/resilience.md
  search:
    opensearch:
      url: ${OPENSEARCH_URL:http://localhost:9200}
      connect-timeout: 1s
      read-timeout: 2s
      # 연결 풀 크기 · 풀에서 연결을 빌리려고 기다리는 시간 (넘으면 바로 LIKE로 대신, #574)
      max-connections: 20
      connection-request-timeout: 200ms
  image:
    base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/team06-replant-images}
  s3:
    bucket: ${S3_BUCKET_NAME:team06-replant-images}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    upload-url-duration: 10m
  # 사진 검수 외부 API. 키가 없어도 앱은 뜨고, 검수는 엔진 오류로 관리자 확인
  review:
    openai:
      api-key: ${OPENAI_API_KEY:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    retry-backoff: 1s
    # 엔진 오류 재처리 스케줄러 (5분마다, 최대 3회)
    retry:
      enabled: true
      interval: PT5M
    # 관리자 확인 기한 스케줄러 (10분마다, 관리자 확인으로 간 지 24시간 지나면 REVIEW_EXPIRED)
    deadline:
      enabled: true
      interval: PT10M
    # 관리자 확인 12시간 지연 알림 (한국 시간 09~21시 매 정각, 새로 지연된 건을 묶어 ImageReviewDelayed 1개). 켜고 끄기는 deadline.enabled
    delay-alert:
      cron: "0 0 9-21 * * *"
