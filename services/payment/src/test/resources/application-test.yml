    toss:
      key-encryption-key: ${PAYMENT_KEY_ENCRYPTION_KEY:ioS+/EE8gO4Wm0h9V9RsOB0L/S3pTG8UUIB+CC2rvK0=}

internal-api:
  key: test-internal-key

# Kafka 리스너는 끈다: 로컬 Kafka가 켜져 있으면 실제 앱과 같은 payment 그룹으로 이벤트를 읽을 수 있어서.
# 리스너를 확인하는 테스트만 켠다
spring:
