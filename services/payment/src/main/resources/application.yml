spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:payment_app}
    password: ${DB_PASSWORD:payment_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8084

jwt:
  public-key: ${JWT_PUBLIC_KEY}

# /internal/** 요청의 X-Internal-Key 확인용 (common-security). 비어 있으면 앱은 뜨고 내부 요청만 401
internal-api:
  key: ${INTERNAL_API_KEY:}

custom:
  payment:
    toss:
      secret-key: ${TOSS_SECRET_KEY:}
      base-url: https://api.tosspayments.com
      key-encryption-key: ${PAYMENT_KEY_ENCRYPTION_KEY}
      connect-timeout: 3s
      read-timeout: 65s
