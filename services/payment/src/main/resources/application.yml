spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:payment_app}
    password: ${DB_PASSWORD:payment_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    consumer:
      # Consumer Group = 서비스 이름 (docs/conventions/events.md)
      group-id: payment
      # 그룹이 처음 붙는 토픽(member.events.v1)은 앞에 쌓인 가입 이벤트부터 받음 (지갑, 복제본이 빠지지 않게)
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 봉투(EventEnvelope)로 받음. 형식이 깨지면 재시도 없이 원래토픽.DLT
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.justcommit.backend.common.messaging.consumer.EventEnvelopeDeserializer
  http:
    serviceclient:
      # 계좌 조회 (인출 신청 때). 타임아웃은 common-web 내부 호출 기본값(연결 1초, 응답 3초)
      internal-member:
        base-url: ${MEMBER_SERVICE_URL:http://localhost:8081}

server:
  port: 8084

jwt:
  public-key: ${JWT_PUBLIC_KEY}

# /internal/** 요청의 X-Internal-Key 확인용 (common-security), 내부 호출 때 보내는 키
# 내부 호출 그룹이 있어 키가 비어 있으면 앱이 시작하지 않는다
internal-api:
  key: ${INTERNAL_API_KEY}
  groups:
    - internal-member

custom:
  payment:
    toss:
      secret-key: ${TOSS_SECRET_KEY:}
      base-url: https://api.tosspayments.com
      key-encryption-key: ${PAYMENT_KEY_ENCRYPTION_KEY}
      connect-timeout: 3s
      read-timeout: 60s
    cash-out:
      # 인출 계좌번호 암호화 키 (결제키 암호화 키와 다른 값). 없으면 앱이 시작하지 않는다
      account-encryption-key: ${CASH_OUT_ACCOUNT_ENCRYPTION_KEY}
    # 결과 불명 충전(PENDING) 복구 스케줄러 (#363). 값의 원본은 docs/reference/schedulers.md
    charge-recovery:
      interval: 5m
      batch-size: 100
      first-delay: 5m
      retry-delays: 15m, 60m
      max-lookup-failures: 3
      unconfirmed-delay: 15m
      review-after: 60m
      auth-error-delay: 15m
      # 한 건을 확보한 뒤 다른 인스턴스가 다시 잡지 않게 미루는 시간 (토스 응답 타임아웃 60초보다 길게)
      lease: 2m
  # 인출 지급 은행. fake: 메모리에서 항상 성공 (모의 은행 서버 연결은 #389)
  bank:
    mode: ${BANK_MODE:fake}
