spring:
  application:
    name: settlement-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settlement_db}
    username: ${DB_USERNAME:settlement_app}
    password: ${DB_PASSWORD:settlement_app}
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    consumer:
      # 봉투(EventEnvelope)로 받고 eventType으로 payload 클래스를 고른다
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.justcommit.backend.common.messaging.consumer.EventEnvelopeDeserializer
  http:
    serviceclient:
      internal-payment:
        base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}

server:
  port: 8085

jwt:
  public-key: ${JWT_PUBLIC_KEY}

internal-api:
  key: ${INTERNAL_API_KEY}
  groups:
    - internal-payment

custom:
  kafka:
    topics:
      market-events: ${MARKET_EVENTS_TOPIC:market.events.v1}
      shipment-picked-up: ${SHIPMENT_PICKED_UP_TOPIC:market.shipment-picked-up.v1}
