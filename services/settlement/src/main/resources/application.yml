spring:
  application:
    name: settlement-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settlement_db}
    username: ${DB_USERNAME:settlement_app}
    password: ${DB_PASSWORD:settlement_app}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8085

jwt:
  public-key: ${JWT_PUBLIC_KEY}
  groups:
    - internal-payment