spring:
  application:
    name: settlement-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settlement_db}
    username: ${DB_USERNAME:settlement_app}
    password: ${DB_PASSWORD:settlement_app}
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    consumer:
      # Consumer Group = 서비스 이름 (docs/conventions/events.md)
      group-id: settlement
      # 그룹이 처음 붙는 토픽(market.events.v1)은 앞에 쌓인 구매 확정부터 받음 (market이 먼저 배포돼도 빠지지 않게)
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 봉투(EventEnvelope)로 받음. 형식이 깨지면 재시도 없이 원래토픽.DLT (옛 토픽은 KafkaConfig의 문자열 팩토리)
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.justcommit.backend.common.messaging.consumer.EventEnvelopeDeserializer
  http:
    serviceclient:
      internal-payment:
        base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}

server:
  port: 8085

jwt:
  public-key: ${JWT_PUBLIC_KEY}

internal-api:
  key: ${INTERNAL_API_KEY}
  groups:
    - internal-payment

custom:
  kafka:
    topics:
      # 옛 구매 확정 토픽: market이 market.events.v1로 옮기는 동안만 함께 받음
      purchase-confirmed: ${PURCHASE_CONFIRMED_TOPIC:market.purchase-confirmed.v1}
