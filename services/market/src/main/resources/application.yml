spring:
  application:
    name: market-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/market_db}
    username: ${DB_USERNAME:market_app}
    password: ${DB_PASSWORD:market_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
  # 내부 API 그룹 주소. 연결 1초 · 응답 3초는 common-web 기본값
  http:
    serviceclient:
      product:
        base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
      payment:
        base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
      settlement:
        base-url: ${SETTLEMENT_SERVICE_URL:http://localhost:8085}

server:
  port: 8083
jwt:
  public-key: ${JWT_PUBLIC_KEY}
internal-api:
  # 빈 기본값: 환경변수가 없으면 common-web이 기동을 막는다 (기본값이 없으면 "${...}" 문자열이 키로 들어감)
  key: ${INTERNAL_API_KEY:}
  groups: [product, payment, settlement]

custom:
  kafka:
    topics:
      purchase-confirmed: ${PURCHASE_CONFIRMED_TOPIC:market.purchase-confirmed.v1}
      seller-order-paid: ${SELLER_ORDER_PAID_TOPIC:market.seller-order-paid.v1}
      seller-order-cancelled: ${SELLER_ORDER_CANCELLED_TOPIC:market.seller-order-cancelled.v1}
      order-item-cancelled: ${ORDER_ITEM_CANCELLED_TOPIC:market.order-item-cancelled.v1}
      order-item-auto-confirmed: ${ORDER_ITEM_AUTO_CONFIRMED_TOPIC:market.order-item-auto-confirmed.v1}
      shipment-picked-up: ${SHIPMENT_PICKED_UP_TOPIC:market.shipment-picked-up.v1}
      shipment-status-changed: ${SHIPMENT_STATUS_CHANGED_TOPIC:market.shipment-status-changed.v1}
  courier:
    api-key: ${COURIER_API_KEY:}
    base-url: ${COURIER_BASE_URL:http://localhost:3000}
    webhook-api-key: ${WEBHOOK_API_KEY:}
