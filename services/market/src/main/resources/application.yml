spring:
  application:
    name: market-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/market_db}
    username: ${DB_USERNAME:market_app}
    password: ${DB_PASSWORD:market_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: market
      # 그룹이 처음 생길 때(첫 배포), 그 전에 쌓인 회원 이벤트부터 읽어 복제본을 채움
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.justcommit.backend.common.messaging.consumer.EventEnvelopeDeserializer
  # 내부 API 그룹 주소. 연결 1초 · 응답 3초는 common-web 기본값
  http:
    serviceclient:
      product:
        base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
      payment:
        base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
      settlement:
        base-url: ${SETTLEMENT_SERVICE_URL:http://localhost:8085}

server:
  port: 8083
jwt:
  public-key: ${JWT_PUBLIC_KEY}
internal-api:
  # 빈 기본값: 환경변수가 없으면 common-web이 기동을 막는다 (기본값이 없으면 "${...}" 문자열이 키로 들어감)
  key: ${INTERNAL_API_KEY:}
  groups: [product, payment, settlement]

custom:
  courier:
    api-key: ${COURIER_API_KEY:}
    base-url: ${COURIER_BASE_URL:http://localhost:3000}
    webhook-api-key: ${WEBHOOK_API_KEY:}
