spring:
  application:
    name: market-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/market_db}
    username: ${DB_USERNAME:market_app}
    password: ${DB_PASSWORD:market_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: market
      # 그룹이 처음 생길 때(첫 배포), 그 전에 쌓인 회원 이벤트부터 읽어 복제본을 채움
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.justcommit.backend.common.messaging.consumer.EventEnvelopeDeserializer
  # @Scheduled 스레드 수 (기본 1). 자동 거절, Saga 복구, 택배 예약처럼 외부를 부르는 작업이 길어져도
  # 다른 작업이 제 주기에 돌게 한다. 작업마다 SKIP LOCKED나 임대로 막고 있어 동시에 돌아도 안전하다 (docs/reference/schedulers.md)
  task:
    scheduling:
      pool:
        size: 4
  # 내부 API 그룹 주소. 연결 1초 · 응답 3초는 common-web 기본값
  http:
    serviceclient:
      product:
        base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
      payment:
        base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
      settlement:
        base-url: ${SETTLEMENT_SERVICE_URL:http://localhost:8085}
      # 장바구니 추천. 응답 2초를 넘기면 기다리지 않고 빈 목록 (resilience.md market → ai)
      ai:
        base-url: ${AI_SERVICE_URL:http://localhost:8087}
        read-timeout: 2s

server:
  port: 8083
jwt:
  public-key: ${JWT_PUBLIC_KEY}
internal-api:
  # 빈 기본값: 환경변수가 없으면 common-web이 기동을 막는다 (기본값이 없으면 "${...}" 문자열이 키로 들어감)
  key: ${INTERNAL_API_KEY:}
  groups: [product, payment, settlement, ai]

messaging:
  # 판매자 배송지 이벤트(member.address.events.v1) 복호화 키. member와 같은 값 (env-vars.md)
  address-event-cipher:
    current-key: k1
    keys:
      # 기본값 없음: 환경변수가 없으면 앱이 시작하지 않는다
      k1: ${MEMBER_ADDRESS_EVENT_KEY}

custom:
  courier:
    api-key: ${COURIER_API_KEY:}
    base-url: ${COURIER_BASE_URL:http://localhost:3000}
    webhook-api-key: ${WEBHOOK_API_KEY:}
