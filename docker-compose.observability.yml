# 최종 MSA 데이터 서버(t3.medium, 10.0.7.79)의 관측 도구 (#301). docs/infra/observability.md
# PostgreSQL · Kafka · OpenSearch는 docker-compose.data.yml, 이 파일은 그 옆에 따로 띄운다.
#
# 실행 (서버 ~/replant 에서):
#   DATA_IP=10.0.7.79 docker compose -f docker-compose.observability.yml up -d   (deploy/data/up.sh와 같은 사설 IP)
#
# 흐름
#   앱 서버 Alloy ──로그──▶ Loki(3100)
#   앱 서버 Alloy ──지표(remote_write)──▶ Prometheus(9090)   ← 앱 서버 서비스 · node-exporter는 Alloy가 긁어서 밀어 넣는다
#   Prometheus ──직접 수집──▶ 이 서버의 node-exporter · postgres-exporter · kafka-exporter
#   Grafana(127.0.0.1:3000) ◀── SSH 터널로만 접속
#
# 비밀값은 서버 ~/secrets/ 에만 둔다 (레포 · 채팅에 올리지 않음)
#   grafana.env            GF_SECURITY_ADMIN_PASSWORD
#   postgres-exporter.env  DATA_SOURCE_PASS (읽기 전용 감시 계정 monitoring의 비밀번호)
#     계정 만들기 (처음 한 번):
#     docker exec -it replant-postgres psql -U postgres -c "CREATE ROLE monitoring LOGIN PASSWORD '<비밀번호>' IN ROLE pg_monitor;"
#
# 포트: Loki · Prometheus는 이 서버 사설 IP에만 열고, 보안 그룹이 앱 서버 보안 그룹에서 오는 3100 · 9090만 허용한다.
#   Grafana는 127.0.0.1에만 연다 → 인터넷 · 앱 서버 어디서도 안 보이고 SSH 터널로만 들어간다 (docs/reference/ports.md)
#
# 메모리 한도 합 약 0.95GB (Tempo 256m는 ⑤ 단계에서 추가). 보관: Loki 14일 · Prometheus 7일
name: replant-obs

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  loki:
    <<: *common
    image: grafana/loki:3.5.0
    container_name: replant-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${DATA_IP:?DATA_IP is required}:3100:3100"
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    mem_limit: 256m

  prometheus:
    <<: *common
    image: prom/prometheus:v3.4.0
    container_name: replant-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # 앱 서버 Alloy가 지표를 밀어 넣을 수 있게 (POST /api/v1/write)
      - --web.enable-remote-write-receiver
    ports:
      - "${DATA_IP}:9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 384m

  grafana:
    <<: *common
    image: grafana/grafana:12.0.0
    container_name: replant-grafana
    env_file: ${HOME}/secrets/grafana.env # GF_SECURITY_ADMIN_PASSWORD
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 192m
    depends_on: [loki, prometheus]

  # 이 서버(데이터 서버)의 CPU · 메모리 · 디스크 · CPU steal. 포트를 열지 않고 Prometheus만 compose 네트워크로 읽는다
  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.9.1
    container_name: replant-node-exporter
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 32m

  # PostgreSQL 커넥션 수 · 트랜잭션 · DB 크기. 앱 서버 서비스와 같은 주소(사설 IP:5432)로 붙는다
  postgres-exporter:
    <<: *common
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: replant-postgres-exporter
    env_file: ${HOME}/secrets/postgres-exporter.env # DATA_SOURCE_PASS
    environment:
      DATA_SOURCE_URI: "${DATA_IP}:5432/postgres?sslmode=disable"
      DATA_SOURCE_USER: monitoring
    mem_limit: 48m

  # Kafka 토픽별 메시지 위치(offset). DLT 유입 알림용 (*.DLT 토픽에 메시지가 늘면). Kafka 4.2.1과 연결 확인함
  kafka-exporter:
    <<: *common
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: replant-kafka-exporter
    command: ["--kafka.server=${DATA_IP}:9092"]
    mem_limit: 48m

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
