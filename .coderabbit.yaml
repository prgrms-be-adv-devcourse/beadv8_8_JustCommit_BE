# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"

reviews:
  profile: "chill"                 # 사소한 지적 줄이고 중요한 것 위주
  request_changes_workflow: false  # "변경 요청"으로 머지를 막지 않음 (보조 리뷰)
  high_level_summary: true         # PR 요약
  poem: false
  auto_review:
    enabled: true
    drafts: false                  # Draft PR은 리뷰하지 않음
    base_branches:
      - develop
      - main
  path_filters:
    - "!**/build/**"
  path_instructions:
    - path: "src/main/java/**"
      instructions: |
        Spring Modulith 모듈 경계를 확인해 주세요.
        - 다른 모듈의 Repository나 JPA 엔티티를 직접 참조하지 않고, 상대 모듈 최상위 패키지의 공개 API·DTO만 사용해야 합니다.
        - 모듈 사이에 JPA 연관관계(@ManyToOne 등)를 만들지 말고 ID만 저장해야 합니다.
        - common에는 비즈니스 로직을 넣지 않습니다.
    - path: "src/main/java/**/*Redis*"
      instructions: |
        운영 Redis는 maxmemory-policy noeviction이라 모든 키에 TTL이 있어야 합니다.
        키 형식은 도메인:용도:식별자(소문자, 콜론)이고, 토큰 원문은 저장하지 않고 해시로 저장합니다.
    - path: "src/main/resources/**"
      instructions: |
        비밀번호, 키, 토큰 같은 비밀값이 직접 들어가 있으면 지적해 주세요. 운영 값은 ${환경변수}로만 받습니다.

chat:
  auto_reply: true
