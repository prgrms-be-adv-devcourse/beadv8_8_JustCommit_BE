services:
  postgres:
    image: postgres:17-alpine
    container_name: justcommit-postgres
    environment:
      POSTGRES_DB: justcommit
      POSTGRES_USER: justcommit
      POSTGRES_PASSWORD: justcommit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justcommit -d justcommit"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: justcommit-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.2.1
    container_name: justcommit-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 로컬용 S3 호환 저장소. 운영 S3 대신 써서 AWS 키 없이 이미지 업로드를 개발한다.
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: justcommit-rustfs
    environment:
      RUSTFS_ACCESS_KEY: replantlocal
      RUSTFS_SECRET_KEY: replantlocal123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # 웹 콘솔
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 처음 한 번 버킷·공개 정책·CORS를 운영과 같게 만들고 종료한다.
  rustfs-init:
    image: amazon/aws-cli:2.38.0
    container_name: justcommit-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: replantlocal
      AWS_SECRET_ACCESS_KEY: replantlocal123
      AWS_DEFAULT_REGION: ap-northeast-2
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      - ./docker/s3:/init:ro
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  rustfs-data:

