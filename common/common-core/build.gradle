plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'io.spring.dependency-management'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
    }
}

dependencies {
    api 'org.springframework:spring-web'
    api 'com.fasterxml.jackson.core:jackson-annotations'

    // 테스트 공유 컨테이너 (testFixtures). Kafka는 쓰는 서비스만 testcontainers-kafka를 가져온다
    testFixturesApi 'org.springframework:spring-test'
    testFixturesApi 'org.testcontainers:testcontainers'
    testFixturesApi 'org.testcontainers:testcontainers-postgresql'
    testFixturesCompileOnly 'org.testcontainers:testcontainers-kafka'
    // 테스트 클래스 사이 데이터 비우기(ResetDataBeforeClassListener). Redis는 쓰는 모듈에만 있으므로 컴파일용으로만
    testFixturesCompileOnly 'org.springframework.data:spring-data-redis'
}
