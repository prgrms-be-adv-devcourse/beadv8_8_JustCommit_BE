# 최종 MSA 앱 서버 Nginx (서버에 직접 설치, /etc/nginx/sites-available/replant)
#   - / 는 프론트 정적 파일, API · 로그인 경로는 K3s Gateway(NodePort 30080)로
#   - /internal/** 은 밖에서 못 부르게 막는다 (docs/reference/ports.md)
#   - X-Forwarded-For · X-Real-IP는 실제 접속 IP로 덮어쓴다 (헤더를 꾸며 IP 기준 요청 수 제한을 피하지 못하게)
#
# 지금은 HTTP만 연다. 도메인(replant.kro.kr)을 이 서버로 옮긴 뒤
#   sudo certbot --nginx -d replant.kro.kr
# 를 실행하면 certbot이 이 파일에 443 · 인증서 · HTTP→HTTPS 이동을 넣는다.

upstream replant_gateway {
    server 10.0.7.76:30080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name replant.kro.kr _;

    client_max_body_size 10m;

    root /var/www/replant;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

    # 서비스끼리만 쓰는 내부 API
    location ^~ /internal/ { return 404; }

    # 알림 SSE: 연결을 오래 열어 두고 받은 즉시 넘긴다. = 매칭이 아래 정규식보다 먼저 적용된다
    location = /api/v1/notifications/subscribe {
        proxy_pass http://replant_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    location ~ ^/(api|oauth2|login/oauth2)(/|$) {
        proxy_pass http://replant_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}
