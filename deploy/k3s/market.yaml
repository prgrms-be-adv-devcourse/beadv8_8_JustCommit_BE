# market 파드 2개 (ADR 0014). 두 파드는 같은 market DB를 쓴다
#   - Gateway → Service 이름 market:8080
#   - compose 서비스(member 등) → 서버 포트 30083 (내부 API)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market
  namespace: replant
  labels:
    app: market
spec:
  replicas: 2
  selector:
    matchLabels:
      app: market
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: market
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 30
      containers:
        - name: market
          image: ghcr.io/prgrms-be-adv-devcourse/replant-market:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: replant-endpoints
            - secretRef:
                name: market-env
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: market
  namespace: replant
spec:
  type: NodePort
  selector:
    app: market
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30083
