# 데이터 서버 Tempo (#301, ADR 0027). 단일 프로세스 · 디스크 저장 · 보관 3일
# 앱 서버 Alloy가 OTLP gRPC(4317)로 추적을 보내고, Grafana가 3200으로 조회한다
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

# 단일 프로세스에서 조회 작업자가 자기 자신(query-frontend, gRPC 9095)에 붙게 한다.
# 비워 두면 traceId 한 건 조회가 응답 없이 멈출 수 있다 (Tempo 경고 「Worker address is empty」)
querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9095

compactor:
  compaction:
    block_retention: 72h # 3일
    # 합친 블록 크기 · 추적 수 상한. 기본값(100GiB · 600만)이면 부하 측정 때 쌓인 블록을 한 번에 합치다
    # 메모리 한도를 넘어 OOMKilled → 재시작마다 같은 컴팩션을 다시 시작해 멈추지 않았다 (#679)
    max_block_bytes: 52428800 # 50MiB
    max_compaction_objects: 300000

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
