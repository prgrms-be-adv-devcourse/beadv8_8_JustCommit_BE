name: AI Review

# PR에 ai-review 라벨을 붙이면 Claude가 리뷰 코멘트를 남긴다 (모든 PR 자동 아님, #221)
# 인증: 레포 시크릿 CLAUDE_CODE_OAUTH_TOKEN (Claude 구독 토큰, `claude setup-token`으로 발급)
# 코멘트만 남긴다. 승인·변경 요청·머지·커밋은 할 수 없게 허용 도구를 제한했다.
on:
  pull_request:
    types: [labeled]
  # 닫힌 PR 등 라벨로 못 돌리는 PR을 Actions 탭 "Run workflow"에서 번호로 리뷰 (워크플로는 develop 것을 씀)
  workflow_dispatch:
    inputs:
      pr_number:
        description: 리뷰할 PR 번호
        required: true
        type: number

# 같은 PR에 ai-review 라벨을 다시 붙이면 이전 리뷰는 취소.
# 그룹에 라벨 이름을 넣어, 리뷰 중 다른 라벨(chore 등)을 붙여도 진행 중인 리뷰가 취소되지 않게 한다
concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event.label.name || 'manual' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # 수동 실행이거나, 라벨 이름이 ai-review일 때만. 포크 PR은 시크릿을 못 읽으므로 제외
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'ai-review' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 수동 실행은 포크 PR을 막지 못하므로 여기서 거른다 (시크릿이 있는 잡에서 외부 코드를 읽지 않게)
      - name: 수동 실행 대상 확인 (포크 PR 제외)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr view ${{ inputs.pr_number }} -R ${{ github.repository }} --json isCrossRepository -q .isCrossRepository)" = "true" ]; then
            echo "포크 PR은 AI 리뷰를 하지 않습니다"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 수동 실행이면 그 PR의 마지막 커밋을 받는다 (닫힌 PR도 refs/pull/N/head는 남아 있음)
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || '' }}
          # 코드만 읽으면 되므로 GITHUB_TOKEN을 .git/config에 남기지 않는다 (PR 내용으로 토큰을 읽어 내는 일 방지)
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude GitHub App 없이 기본 토큰으로 코멘트를 단다 (작성자: github-actions[bot])
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
            PR HEAD SHA: ${{ github.event.pull_request.head.sha || '(수동 실행: gh pr view --json headRefOid로 확인)' }}

            이 PR을 리뷰해 주세요. PR의 마지막 커밋이 이미 체크아웃되어 있습니다.
            인라인 코멘트 도구를 쓸 수 없으면(수동 실행 등) 🔴 항목도 요약 코멘트에 설명까지 적으세요.
            `gh pr view`와 `gh pr diff`로 변경 내용을 보고, 판단 근거는 매번 아래 레포 문서에서 찾으세요.
            - docs/spring_modulith_structure.md, docs/module-architecture.md (모듈·계층 규칙)
            - docs/policy.md (서비스 정책)
            - docs/infrastructure-todo.md (Redis 키·TTL, Kafka 이벤트 규칙)
            - README.md

            ## 확인할 것
            - 정확성: id 혼동(memberId·sellerId·orderId 등), null 처리, 트랜잭션 안의 외부 호출, 빈 catch
            - 모듈 경계: 다른 모듈의 엔티티·Repository 직접 사용 금지. 공개 API(XxxQuery + record)로만 접근. package-info의 allowedDependencies 갱신 여부
            - 계층: presentation / application / domain / infrastructure 위치. 외부 API DTO는 infrastructure
            - API: URL에 동사 금지·복수형, 상태 변경은 PATCH + body, ApiResponse 사용, 요청 DTO는 {도메인}{행위}Request record
            - 예외·로그: BusinessException + 모듈 ErrorCode, 로그에 식별 id 포함, 개인정보(이름·전화·주소·계좌) 로그 금지
            - 정책: docs/policy.md와 어긋나는지, Redis 키 이름·TTL 규칙
            - 보안: 비밀값·키가 코드에 들어갔는지. SecurityConfig 변경은 "담당자 확인 필요"로 표시
            - 테스트: 새 로직에 테스트가 있는지, 시간은 고정(Clock 등)했는지, @DisplayName은 한국어인지
            - 컨벤션: PR 제목 "타입: 내용", 본문에 Closes #이슈

            ## 남기는 방법
            - 인라인 코멘트(mcp__github_inline_comment__create_inline_comment, confirmed: true)는 🔴 꼭 고칠 것에만 쓰세요. 🟡·🟢는 인라인으로 남기지 마세요.
            - 요약 코멘트는 PR에 1개만 유지합니다. 반드시 아래 명령으로 남기세요
              (이전 AI 요약이 있으면 그것을 고쳐 쓰고, 없으면 새로 만듭니다):
              gh pr comment ${{ github.event.pull_request.number || inputs.pr_number }} --edit-last --create-if-none --body '<요약>'
              본문은 작은따옴표로 감싸고(백틱이 셸 명령으로 실행되지 않게), 본문 안의 작은따옴표는 ’로 바꾸세요.

              요약은 읽기 쉽게 아래 형식을 그대로 따르세요. 지적은 표에 한 줄씩만 쓰고, 이유는 접힌 곳에 씁니다.

              🤖 AI 리뷰 (Claude) · 기준 커밋 `<PR HEAD SHA 앞 7자리>`

              > **한 줄 요약:** <이 PR을 한 문장으로>. 🔴 <개수> · 🟡 <개수> · 🟢 <개수>

              ### 📦 이 PR이 하는 일
              - 변경 내용을 3~5줄로. 무엇을 추가·변경했고 어떤 흐름으로 동작하는지 (클래스·메서드 이름 포함)
              - 리뷰어가 코드를 열기 전에 흐름을 파악할 수 있게 쓰세요

              ### 🔍 지적 사항
              | | 위치 | 내용 |
              |---|---|---|
              | 🔴 | `파일:줄` | 한 줄 요약 (인라인으로도 남긴 항목은 끝에 "· 인라인 참고") |
              (🔴 → 🟡 → 🟢 순서, 전체 최대 10개. 지적이 없으면 표 대신 "지적 사항 없음")

              <details><summary>자세한 설명 펼치기</summary>

              항목마다 위치를 굵게 쓰고, 무엇이 문제인지와 이유(근거 문서가 있으면 문서 이름), 고치는 방향을 2~4줄로

              </details>

              ### 👍 잘한 점
              - 1~2개
            - 모두 한국어로, 확실하지 않은 내용은 "확인 필요"라고 쓰세요. 문제가 없으면 없다고 쓰세요.
            - 코드를 직접 고치거나 커밋하지 말고, 승인(Approve)이나 변경 요청(Request changes)도 하지 마세요.
