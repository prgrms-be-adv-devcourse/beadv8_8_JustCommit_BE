# develop에 머지될 때 Gradle 의존성 · 컴파일 결과를 Actions 캐시에 저장한다 (#664)
#
# - 왜: setup-gradle은 기본 브랜치(develop)에서 돈 job만 캐시를 저장하고, PR job은 읽기만 한다.
#   CI(ci.yml)는 PR에서만 돌고 CD(cd.yml)는 Docker 안에서 Gradle을 돌려서, 이 파일 전에는 캐시가 한 번도 저장되지 않았다
#   → PR마다 Gradle 배포판 · 의존성을 처음부터 내려받았다 (11/21~11/27 PR CI 28건 모두 "cache not found")
# - PR의 setup-gradle은 같은 job 캐시가 없으면 "같은 OS의 가장 최근 캐시"를 찾으므로, 이 job이 저장한 캐시를 그대로 읽는다
# - 테스트는 돌리지 않는다 (testClasses = 메인 · 테스트 코드 컴파일까지). 검증은 PR CI의 build가 한다
name: Gradle cache

on:
  push:
    branches: [develop]
    paths:
      - 'common/**'
      - 'gateway/**'
      - 'services/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/gradle-cache.yml'
  workflow_dispatch:

# 연달아 머지되면 마지막 것만 저장하면 된다
concurrency:
  group: gradle-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false # develop에서는 저장 (기본값도 같지만 이 job의 목적이라 명시)

      - name: 의존성 받기 · 컴파일
        run: ./gradlew testClasses
