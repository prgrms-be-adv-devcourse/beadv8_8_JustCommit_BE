# PR마다 바뀐 모듈만 컴파일 · 테스트한다. 규칙 원본: docs/testing/strategy.md 「단계」 ② PR CI
#
# - common/ · Gradle 설정 · 루트 src/ · 이 파일이 바뀌면 전체(./gradlew build)
# - gateway/ · services/{서비스}/가 바뀌면 그 모듈만(:gateway:build, :services:{서비스}:build)
# - 그 밖(docs/ 등)만 바뀌면 빌드 없이 통과
# - CHANGELOG 스크립트 테스트(scripts/test_changelog.py)는 모든 PR에서 실행
# - CHANGELOG 규칙 확인(scripts/changelog.py verify-pr)은 develop 대상 PR에서만 실행. 규칙 원본: docs/changelog.d/README.md
# job 이름 build는 ruleset develop-ci의 필수 체크라 바꾸지 않는다 (경로와 상관없이 항상 실행돼야 머지가 안 막힌다)
name: CI

on:
  pull_request:
    branches: [develop, main]

# 같은 PR에 새 커밋이 오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # 테스트 결과를 PR Checks에 표시
  pull-requests: write # 테스트 결과 요약 댓글 (포크 PR은 읽기 전용 토큰이라 댓글 단계를 건너뜀)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40 # 전체 빌드는 모듈 8개 + Testcontainers라 길다
    env:
      # 운영 컨테이너와 같은 시간대 (Dockerfile -Duser.timezone=Asia/Seoul, docs/infra/deploy.md)
      # 러너 기본값 UTC로 돌리면 Clock(Asia/Seoul)과 LocalDateTime.now()를 섞어 쓰는 테스트가 9시간 어긋난다
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # base 브랜치와 비교하려고 이력을 받는다

      # 통합 스크립트 자체의 테스트 (#640). 모든 PR(develop · main 대상)에서 실행한다 (1~2초, 추가 설치 없음)
      - name: CHANGELOG 스크립트 테스트
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      # CHANGELOG 조각 파일 규칙 (#640). develop 대상 PR에서만 실행한다
      # - 빌드할 모듈이 없는 PR(docs만)에서도 실행되도록 「바뀐 모듈 고르기」보다 앞에 둔다
      # - main 대상 PR은 건너뛴다. 지금은 develop 중심으로 작업하고 변경 기록도 develop으로 들어올 때 확인하기 때문이다
      # - 최종 main 반영 절차는 아직 정해지지 않았다. 정해지면 이 조건을 다시 검토한다 (docs/changelog.d/README.md 「CI가 확인하는 것」)
      - name: CHANGELOG 규칙 확인
        if: github.base_ref == 'develop'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/changelog.py verify-pr "$BASE_SHA"

      - name: 바뀐 모듈 고르기
        id: pick
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "바뀐 파일:"; echo "$files"

          if echo "$files" | grep -qE '^(common/|gradle/|src/|build\.gradle$|settings\.gradle$|gradle\.properties$|gradlew$|\.github/workflows/ci\.yml$)'; then
            tasks="build"
          else
            tasks=""
            if echo "$files" | grep -q '^gateway/'; then tasks=":gateway:build"; fi
            for s in member product market payment settlement notification ai; do
              if echo "$files" | grep -q "^services/$s/"; then tasks="$tasks :services:$s:build"; fi
            done
          fi

          tasks="$(echo $tasks | xargs)"
          echo "실행할 작업: ${tasks:-(없음, 빌드할 모듈이 바뀌지 않음)}"
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        if: steps.pick.outputs.tasks != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: steps.pick.outputs.tasks != ''
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false # TEMP #664 측정용: 이 PR 안에서 캐시 저장 → 머지 전에 지움

      # 컴파일 + 테스트. --continue: 한 모듈이 실패해도 나머지 모듈 결과까지 본다
      - name: Build
        if: steps.pick.outputs.tasks != ''
        run: ./gradlew ${{ steps.pick.outputs.tasks }} --continue

      - name: Publish test results
        if: ${{ !cancelled() && steps.pick.outputs.tasks != '' }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/build/test-results/test/*.xml'
          detailed_summary: true

      # 모듈별 표 + 실패 목록을 PR 댓글 1개로 남기고, 새 커밋마다 같은 댓글을 고친다 (#534)
      # 빌드할 모듈이 없는 PR(docs만)은 댓글 없음. 표시 문자열 <!-- ci-test-summary -->로 이전 댓글을 찾는다
      - name: 테스트 결과 댓글
        if: >-
          !cancelled() && steps.pick.outputs.tasks != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/test_summary.py "$SHA" > "$RUNNER_TEMP/test-summary.md"
          cat "$RUNNER_TEMP/test-summary.md"
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate             --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ci-test-summary -->"))) | .id' | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/test-summary.md" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$RUNNER_TEMP/test-summary.md" > /dev/null
          fi

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: '**/build/reports/tests/test'
          retention-days: 7

      # CI 실패 시 AI 원인 분석(ci-failure-ai.yml)이 받아 읽을 실패 테스트 결과 (#534)
      # 전체 XML은 Spring 로그(system-out)까지 들어 있어 크므로, 실패 · 오류가 있는 파일만 모은다
      - name: 실패 테스트 XML 모으기
        if: failure() && steps.pick.outputs.tasks != ''
        run: |
          mkdir -p "$RUNNER_TEMP/test-failures"
          find . -path '*/build/test-results/test/*.xml' -print0 \
            | xargs -0 -r grep -lE '<(failure|error)[ >]' \
            | while read -r f; do
                mkdir -p "$RUNNER_TEMP/test-failures/$(dirname "$f")"
                cp "$f" "$RUNNER_TEMP/test-failures/$f"
              done
          echo "모은 파일:"; find "$RUNNER_TEMP/test-failures" -name '*.xml'

      - name: Upload test failures
        if: failure() && steps.pick.outputs.tasks != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: ${{ runner.temp }}/test-failures
          if-no-files-found: ignore # 컴파일 실패면 XML이 없다 (AI 분석은 실패 로그로 본다)
          retention-days: 7
