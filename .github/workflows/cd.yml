# develop에 머지되면 바뀐 서비스만 이미지를 만들어 GHCR에 올리고 앱 서버에 배포한다.
# 규칙 원본: docs/infra/deploy.md 「CI/CD」
#
# 1. changes: 바뀐 파일로 서비스 목록을 고른다 (common/ · Dockerfile · Gradle 설정이 바뀌면 전체)
# 2. build:   서비스마다 루트 Dockerfile(MODULE)로 이미지 → ghcr.io/.../replant-{서비스}:{커밋7자리} + latest
# 3. deploy:  앱 서버의 self-hosted 러너가 compose 서비스는 pull · up, K3s 서비스는 set image · rollout
#             레포 변수 CD_DEPLOY가 'true'일 때만 실행 (러너 설치 전에는 이미지만 만든다)
name: CD

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      services:
        description: "빌드 · 배포할 서비스 (쉼표로 구분, 예: member,market) 또는 all"
        required: true
        default: all

# 배포는 한 번에 하나씩, 앞의 실행을 취소하지 않고 줄을 세운다
concurrency:
  group: cd-develop
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/prgrms-be-adv-devcourse/replant

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.pick.outputs.services }} # JSON 배열 (build matrix용)
      list: ${{ steps.pick.outputs.list }} # 공백 구분 (deploy 스크립트용)
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 바뀐 서비스 고르기
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.services }}
          BEFORE: ${{ github.event.before }}
        run: |
          ALL="gateway member product market payment settlement notification ai"
          tag="${GITHUB_SHA::7}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$INPUT" = "all" ]; then picked="$ALL"; else picked="$(echo "$INPUT" | tr ',' ' ')"; fi
            for s in $picked; do
              case " $ALL " in *" $s "*) ;; *) echo "::error::모르는 서비스: $s"; exit 1 ;; esac
            done
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # 첫 push · 강제 push로 이전 커밋을 못 찾으면 전체
            picked="$ALL"
          else
            files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            echo "바뀐 파일:"; echo "$files"
            if echo "$files" | grep -qE '^(common/|gradle/|Dockerfile$|build\.gradle$|settings\.gradle$|gradlew$|\.github/workflows/cd\.yml$)'; then
              picked="$ALL"
            else
              picked=""
              if echo "$files" | grep -q '^gateway/'; then picked="gateway"; fi
              for s in member product market payment settlement notification ai; do
                if echo "$files" | grep -q "^services/$s/"; then picked="$picked $s"; fi
              done
            fi
          fi

          list="$(echo $picked | xargs -n1 | awk '!seen[$0]++' | xargs)"
          json="$(printf '%s\n' $list | jq -R . | jq -cs 'map(select(length > 0))')"
          echo "서비스: ${list:-(없음)} · 태그: $tag"
          {
            echo "services=$json"
            echo "list=$list"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.list != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false # 한 서비스가 실패해도 나머지는 올린다
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 · push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: MODULE=${{ matrix.service == 'gateway' && 'gateway' || format('services/{0}', matrix.service) }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ needs.changes.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          # 패키지를 이 레포에 연결한다 (레포 권한으로 push · pull)
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    needs: [changes, build]
    # 빌드가 하나라도 실패하면 배포하지 않는다. 다시 돌리려면 Actions에서 Re-run
    if: needs.changes.outputs.list != '' && vars.CD_DEPLOY == 'true'
    runs-on: [self-hosted, replant-app]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      SERVICES: ${{ needs.changes.outputs.list }}
      TAG: ${{ needs.changes.outputs.tag }}
    steps:
      - name: GHCR 로그인 (이 실행 동안만)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 서버의 ~/.docker 설정을 건드리지 않게 실행 전용 폴더에 로그인한다
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/docker"
          echo "$TOKEN" | DOCKER_CONFIG="$RUNNER_TEMP/docker" docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 배포
        run: |
          set -u
          COMPOSE="docker compose -f $HOME/replant/docker-compose.app.yml"
          # 러너는 서비스로 돌아 ~/.bashrc를 읽지 않는다. KUBECONFIG가 없으면 K3s kubectl이
          # root 전용 /etc/rancher/k3s/k3s.yaml을 읽으려다 실패하므로 ubuntu용 사본을 지정한다 (#301)
          export KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}"
          failed=""

          # 배포 태그 파일 (#590): compose는 ~/replant/.env 의 {서비스}_TAG를 자동으로 읽는다.
          # 배포에 성공한 서비스만 갱신해, 누가 태그 없이 up -d 해도 마지막으로 배포한 버전이 뜨게 한다
          TAGS_FILE="$HOME/replant/.env"
          COMPOSE_SERVICES="member product payment settlement notification"
          tag_var() { echo "$(echo "$1" | tr '[:lower:]' '[:upper:]')_TAG"; }
          # 한 줄만 바꾸고 나머지 줄은 그대로. 같은 폴더 임시 파일에 쓴 뒤 mv로 바꿔 끼워 중간에 깨진 파일이 보이지 않게 한다
          set_tag() {
            tmp=$(mktemp "$TAGS_FILE.XXXXXX")
            { grep -v "^$1=" "$TAGS_FILE" 2>/dev/null || true; echo "$1=$2"; } > "$tmp"
            chmod 644 "$tmp"
            mv -f "$tmp" "$TAGS_FILE"
          }
          # 파일에 없는 서비스는 지금 떠 있는 컨테이너의 태그로 채운다 (처음 · 새 서비스). 컨테이너도 없으면 비워 둔다
          for s in $COMPOSE_SERVICES; do
            var=$(tag_var "$s")
            if ! grep -q "^$var=" "$TAGS_FILE" 2>/dev/null; then
              running=$(docker inspect -f '{{.Config.Image}}' "replant-$s" 2>/dev/null | sed -n 's/.*://p')
              if [ -n "$running" ] && [ "$running" != "latest" ]; then
                set_tag "$var" "$running"
                echo "배포 태그 파일에 없던 $var=$running (지금 떠 있는 컨테이너)"
              fi
            fi
          done

          # 실패 원인을 Actions 로그에 남긴다 (#555). 컨테이너를 다시 바꾸면 로그가 사라져서 실패한 그때 찍는다.
          # 레포가 공개라 Actions 로그도 공개 → 환경변수가 담긴 docker inspect 전체 · kubectl describe 전체는 찍지 않고,
          # 앱 로그도 password · secret · token · key = 값 모양과 URL 안의 비밀번호는 가린다
          redact() {
            sed -E \
              -e 's/((password|passwd|secret|token|api[_-]?key|credential)[a-z_]*[\x27" ]*[=:][\x27" ]*)[^ ,;&\x27"]+/\1***/Ig' \
              -e 's#(://[^/:@ ]+:)[^/@ ]+@#\1***@#g'
          }
          compose_diag() {
            c="replant-$1"
            echo "--- $c 상태 · 헬스체크 기록"
            docker inspect --format '상태={{.State.Status}} 종료코드={{.State.ExitCode}} OOM={{.State.OOMKilled}} 재시작={{.RestartCount}}{{if .State.Health}} 헬스={{.State.Health.Status}}{{range .State.Health.Log}}{{"\n"}}  {{.Start}} exit={{.ExitCode}} {{.Output}}{{end}}{{end}}' "$c" 2>&1 | redact
            echo "--- $c 로그 (마지막 80줄)"
            docker logs --tail 80 "$c" 2>&1 | redact
          }
          k3s_diag() {
            echo "--- deploy/$1 파드"
            kubectl -n replant get pods -l "app=$1" -o wide 2>&1
            # 새로 만든 파드가 가장 최근이다. 2개까지만 본다
            for p in $(kubectl -n replant get pods -l "app=$1" --sort-by=.metadata.creationTimestamp -o name 2>/dev/null | tail -n 2); do
              echo "--- $p 상태 · 이벤트 (describe 요약)"
              out=$(kubectl -n replant describe "$p" 2>&1)
              echo "$out" | grep -E '^\s+(State|Reason|Exit Code|Last State|Ready|Restart Count):'
              echo "$out" | sed -n '/^Events:/,$p'
              echo "--- $p 로그 (마지막 80줄)"
              kubectl -n replant logs "$p" --tail 80 2>&1 | redact
              if prev=$(kubectl -n replant logs "$p" --previous --tail 80 2>/dev/null); then
                echo "--- $p 직전에 죽은 컨테이너 로그 (마지막 80줄)"
                echo "$prev" | redact
              fi
            done
          }

          for s in $SERVICES; do
            image="$IMAGE_PREFIX-$s:$TAG"
            echo "::group::$s → $image"
            case "$s" in
              gateway|market|ai)
                # K3s: 파드를 하나씩 새 이미지로 바꾼다 (롤링). 처음 올리기는 deploy/k3s/README.md대로 수동
                # 진짜로 없을 때(NotFound)만 건너뛰고, 접속 · 권한 오류는 실패로 알린다
                if ! out=$(kubectl -n replant get deploy "$s" 2>&1); then
                  if echo "$out" | grep -q NotFound; then
                    echo "::warning::K3s에 deploy/$s가 아직 없어 건너뜀 (처음 올리기는 수동)"
                  else
                    echo "::error::$s K3s 접속 실패 — $out"
                    failed="$failed $s"
                  fi
                elif kubectl -n replant set image "deploy/$s" "$s=$image" \
                  && kubectl -n replant rollout status "deploy/$s" --timeout=5m; then
                  echo "$s 배포 완료"
                else
                  echo "::error::$s 롤아웃 실패 — 옛 파드가 계속 응답 중. kubectl -n replant rollout undo deploy/$s 로 되돌릴 수 있음"
                  k3s_diag "$s"
                  failed="$failed $s"
                fi
                ;;
              *)
                # compose: {SERVICE}_TAG로 이 서비스만 새 이미지로 바꾼다 (Redis 등 다른 컨테이너는 그대로)
                var=$(tag_var "$s")
                if [ -z "$(cd "$HOME/replant" && $COMPOSE ps -a -q "$s")" ]; then
                  echo "::warning::compose $s 컨테이너가 아직 없어 이미지만 받아 둠 (처음 올리기는 수동)"
                  (cd "$HOME/replant" && env "$var=$TAG" $COMPOSE pull "$s") || failed="$failed $s"
                elif (cd "$HOME/replant" \
                  && env "$var=$TAG" $COMPOSE pull "$s" \
                  && env "$var=$TAG" $COMPOSE up -d --no-deps --wait --wait-timeout 180 "$s"); then
                  # healthy까지 확인된 뒤에만 태그 파일을 바꾼다 (실패하면 옛 태그 그대로)
                  set_tag "$var" "$TAG"
                  echo "$s 배포 완료 ($var=$TAG 기록)"
                else
                  echo "::error::$s 기동 실패 — 아래 상태 · 로그 확인"
                  compose_diag "$s"
                  failed="$failed $s"
                fi
                ;;
            esac
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "::error::배포 실패:$failed"
            exit 1
          fi

      - name: GHCR 로그아웃
        if: always()
        run: |
          docker logout ghcr.io || true
          rm -rf "$RUNNER_TEMP/docker"
