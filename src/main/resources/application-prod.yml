spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      # Redis가 멈춰도 요청 스레드가 오래 묶이지 않도록 짧게 (Lettuce 기본 60초)
      timeout: 2s
      connect-timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  jpa:
    hibernate:
      # 세미 프로젝트: Flyway 없이 엔티티로 테이블을 만든다 (컬럼 추가만 하고 삭제·이름 변경은 하지 않음).
      # 최종 프로젝트 때 Flyway 마이그레이션 + validate로 되돌린다.
      ddl-auto: update

# 메일(Gmail SMTP) 접속 상태는 헬스 체크에서 뺀다. 메일 서버가 잠깐 느려도 앱 전체가 DOWN(503)으로 보이지 않게 하기 위함
management:
  health:
    mail:
      enabled: false

# Nginx 리버스 프록시 뒤에서 X-Forwarded-* 헤더로 원래 주소(https·호스트) 계산
# (카카오 redirect_uri가 http://localhost:8080 등으로 잘못 만들어지지 않도록)
server:
  forward-headers-strategy: framework