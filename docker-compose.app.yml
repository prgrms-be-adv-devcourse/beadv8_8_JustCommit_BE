# 최종 MSA 앱 서버(t3.large)용. compose로 띄우는 서비스 5개 + Redis.
# Gateway · market · ai는 K3s(deploy/k3s/), Nginx는 서버에 직접 설치, 404-express는 자기 레포의 compose.
# 세미 운영(docker-compose.prod.yml)과는 다른 서버 · 다른 파일이다.
#
# 실행 (서버 ~/replant 에서):
#   docker compose -f docker-compose.app.yml pull
#   docker compose -f docker-compose.app.yml up -d
# 한 서비스만 새 이미지로 (CD): MEMBER_TAG=a1b2c3d docker compose -f docker-compose.app.yml up -d member
#
# 비밀값은 서버 ~/secrets/{이름}.env 에만 둔다 (레포 · 채팅에 올리지 않음). 변수 설명: docs/reference/env-vars.md
#   redis.env · member.env · product.env · payment.env · settlement.env · notification.env
#
# 포트는 모두 앱 서버 사설 IP(10.0.7.76)에만 연다. 인터넷에서는 Nginx 80/443만 보인다 (docs/reference/ports.md)
#   K3s 파드(Gateway · market)가 이 주소로 compose 서비스 · Redis를 부른다.
name: replant

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  healthcheck:
    # 8080이 열렸는지만 본다 (actuator가 생기면 HTTP 확인으로 바꾼다)
    test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8080"]
    interval: 10s
    timeout: 3s
    retries: 3
    # 평소 시작은 24~34초지만, 서버가 막 켜졌거나 여러 서비스가 함께 뜰 때 80초를 넘긴 적이 있다 (#555).
    # 이 시간 안의 실패는 세지 않으므로 늦어도 120초 + 10초 × 3 = 약 150초까지 기다린다 (cd.yml --wait-timeout 180보다 짧게)
    start_period: 120s

# 분산 추적: 서비스가 추적(span)을 이 서버의 Alloy(OTLP HTTP 4318)로 보낸다 → 데이터 서버 Tempo (ADR 0027)
x-tracing-env: &tracing-env
  TRACING_EXPORT_ENABLED: "true"
  OTLP_TRACING_ENDPOINT: http://10.0.7.76:4318/v1/traces

services:
  redis:
    image: redis:8-alpine
    container_name: replant-redis
    env_file: ${HOME}/secrets/redis.env # REDIS_PASSWORD
    # 비밀번호는 compose 파일에 펼치지 않고 컨테이너 안 환경변수에서 읽는다
    # 256MB가 차면 쓰기 실패(noeviction), AOF로 매일 꺼졌다 켜져도 토큰 유지 (docs/reference/redis-keys.md)
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "10.0.7.76:6379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 320m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  member:
    <<: *service
    image: ghcr.io/prgrms-be-adv-devcourse/replant-member:${MEMBER_TAG:-latest}
    container_name: replant-member
    env_file: ${HOME}/secrets/member.env
    environment:
      <<: *tracing-env
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MARKET_SERVICE_URL: http://10.0.7.76:30083 # K3s market (NodePort)
      PAYMENT_SERVICE_URL: http://payment:8080
      SETTLEMENT_SERVICE_URL: http://settlement:8080
    ports:
      - "10.0.7.76:8081:8080"
    mem_limit: 768m
    depends_on:
      redis:
        condition: service_healthy

  product:
    <<: *service
    image: ghcr.io/prgrms-be-adv-devcourse/replant-product:${PRODUCT_TAG:-latest}
    container_name: replant-product
    # S3는 EC2 IAM 역할로 접속한다. S3_ENDPOINT · S3_ACCESS_KEY · S3_SECRET_KEY(로컬 RustFS용)는 넣지 않는다
    env_file: ${HOME}/secrets/product.env
    environment: *tracing-env
    ports:
      - "10.0.7.76:8082:8080"
    mem_limit: 768m

  payment:
    <<: *service
    image: ghcr.io/prgrms-be-adv-devcourse/replant-payment:${PAYMENT_TAG:-latest}
    container_name: replant-payment
    env_file: ${HOME}/secrets/payment.env
    environment: *tracing-env
    environment:
      MEMBER_SERVICE_URL: http://member:8080
    ports:
      - "10.0.7.76:8084:8080"
    mem_limit: 512m

  settlement:
    <<: *service
    image: ghcr.io/prgrms-be-adv-devcourse/replant-settlement:${SETTLEMENT_TAG:-latest}
    container_name: replant-settlement
    env_file: ${HOME}/secrets/settlement.env
    environment:
      <<: *tracing-env
      PAYMENT_SERVICE_URL: http://payment:8080
    ports:
      - "10.0.7.76:8085:8080"
    mem_limit: 512m

  notification:
    <<: *service
    image: ghcr.io/prgrms-be-adv-devcourse/replant-notification:${NOTIFICATION_TAG:-latest}
    container_name: replant-notification
    env_file: ${HOME}/secrets/notification.env
    environment: *tracing-env
    ports:
      - "10.0.7.76:8086:8080"
    mem_limit: 512m

  # 로그 · 지표 수집기 (#301, deploy/observability/alloy/config.alloy) → 데이터 서버 Loki · Prometheus
  # 서버 네트워크를 그대로 써서(host) K3s 파드 IP · 사설 IP 포트에 닿고, 들어오는 포트는 열지 않는다
  alloy:
    image: grafana/alloy:v1.9.1
    container_name: replant-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345 # Alloy 자체 화면 · 상태. 서버 안에서만
    network_mode: host
    cgroup: host # 컨테이너 · 파드 메모리(cAdvisor): 서버 전체 cgroup을 본다
    volumes:
      - ./deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro # compose 컨테이너 로그
      - /var/log/pods:/var/log/pods:ro # K3s 파드 로그
      - /etc/rancher/k3s/k3s.yaml:/etc/rancher/k3s/k3s.yaml:ro # K3s 파드 찾기
      - /run/k3s/containerd/containerd.sock:/run/k3s/containerd/containerd.sock:ro # K3s 파드 이름 (cAdvisor)
      - /var/lib/docker:/var/lib/docker:ro # compose 컨테이너 이름 (cAdvisor)
      - /proc:/host/proc:ro # 앱 서버 CPU · 메모리 · steal
      - /sys:/host/sys:ro
      - /:/host/root:ro
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  redis-data:
  alloy-data:
